<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Robert Martinovski - Digital Illustrator &amp; Designer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Digital illustration, brand identity, and visual design by Robert Martinovski. Human-made artwork built with craft and intention."
    />
    <meta
      name="keywords"
      content="digital illustrator, visual designer, brand identity, illustration, Figma, Photoshop, freelance"
    />
    <meta name="author" content="Robert Martinovski" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://robertmartinovski.github.io/portfolio/" />
    <meta property="og:title" content="Robert Martinovski - Digital Illustrator &amp; Designer" />
    <meta
      property="og:description"
      content="Digital illustration, brand identity, and visual design. Human-made artwork built with craft and intention."
    />
    <meta
      property="og:image"
      content="https://robertmartinovski.github.io/portfolio/assets/images/og-preview.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="CyberPanx" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Robert Martinovski - Digital Illustrator &amp; Designer" />
    <meta
      name="twitter:description"
      content="Digital illustration, brand identity, and visual design."
    />
    <meta
      name="twitter:image"
      content="https://robertmartinovski.github.io/portfolio/assets/images/og-preview.jpg"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://robertmartinovski.github.io/portfolio/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Preconnect for Google Fonts (already in styles.scss import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme color (browser UI on mobile) -->
    <meta name="theme-color" content="#092328" />

    <script>
      // GitHub Pages SPA redirect handler - pairs with src/404.html.
      (function () {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect && redirect !== '/') {
          sessionStorage.removeItem('redirect');
          var newUrl = redirect + (window.location.search || '');
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
